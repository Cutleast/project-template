[project]
name = "project-template"  # Enter the repository name of the project here
version = "0.1.0"
description = "Project Template"  # Enter the display name of the project here
authors = [{ name = "Cutleast", email = "cutleast@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cutleast-core-lib",
]

[dependency-groups]
dev = [
    "cx-freeze",
    "pyfakefs",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-qt",
    "ruff",
    "types-requests",
]

[tool.pyrefly]
search-path = [
    "src",
    "core-lib/src",
    "mod-manager-lib/src",
]
project-includes = [
    "src/**/*.py",
    "tests/**/*.py",
]
project-excludes = [
    "**/__pycache__",
    "**/*.old",
    "src/resources_rc.py",
    "**/node_modules",
    "**/.*",
    ".venv",
]
site-package-path = ["./stubs"]
infer-with-first-use = false

[tool.pyrefly.errors]
bad-override = false
deprecated = "warn"
inconsistent-inheritance = "warn"
implicit-any-lambda = "ignore"
implicit-any-parameter = "error"
implicit-any-type-argument = "ignore"
incompatible-comparison = "info"
missing-import = "error"
missing-override-decorator = "warn"
no-access = "warn"
non-exhaustive-match = "ignore"
redundant-cast = "info"
redundant-condition = "info"
unknown-argument-type = "ignore"
unknown-attribute-type = "ignore"
unknown-variable-type = "ignore"
unnecessary-comparison = "info"
untyped-class-decorator = "error"
untyped-function-decorator = "error"
untyped-import = "ignore"

[tool.uv.workspace]
members = [
    "core-lib",
]

[tool.uv.sources]
cutleast-core-lib = { workspace = true }

[tool.ruff]
line-length = 89

[tool.ruff.lint]
extend-select = ["D"]
ignore = [
    "D105",  # Missing docstring in magic method
    "D200",  # One-line docstring should fit on one line
    "D202",  # No blank line before function
    "D205",  # 1 blank line required between summary line and description
    "D212",  # Multi-line docstring summary should start at the second line
    "D415",  # First line should end with a period
    "DTZ007",  # Naive datetime construction
    "PLC0414",  # Import alias does not rename original package
    "RUF012",  # Mutable default values on class-level
    "UP040",  # type MyTypeAlias instead of MyTypeAlias: TypeAlias (still incompatible with Nuitka)
    "UP045",  # T | None instead of Optional[T]
    "UP046",  # New type-parameter syntax for generic classes (still incompatible with Nuitka, see https://github.com/Nuitka/Nuitka/issues/2930)
    "UP047",  # New type-parameter syntax for generic functions (still incompatible with Nuitka, see https://github.com/Nuitka/Nuitka/issues/2930)
]

[tool.ruff.lint.per-file-ignores]
"resources_rc.py" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--ignore=core-lib -vv"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "[%(asctime)s.%(msecs)03d][%(levelname)s][%(name)s.%(funcName)s]: %(message)s"
